[project]
name = "git-tool"
version = "0.1.0"
description = "一站式git管理工具"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "black",
    "loguru",
    "markdown",
    "nuitka==4.2.2",
    "pyside6-fluent-widgets",
    "python-checkup",
    "zstandard",
]
[tool.uv]
override-dependencies = [
    "pyside6-pdf; sys_platform == 'never'",
    "pyside6-webengine; sys_platform == 'never'",
]